<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 340px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            line-height: 1.5;
        }

        .container {
            padding: 28px 24px 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #f5c518;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 15px;
            color: #aaa;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .description {
            font-size: 13px;
            color: #ccc;
            line-height: 1.4;
            max-width: 280px;
            margin: 0 auto;
        }

        .status-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
            padding: 14px 16px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #333;
            font-size: 13px;
            font-weight: 600;
            color: #f5c518;
        }

        .status-banner.inactive {
            color: #999;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f5c518;
            flex-shrink: 0;
        }

        .status-banner.inactive .status-dot {
            background: #666;
            animation: none;
        }

        .status-banner:not(.inactive) .status-dot {
            animation: pulse 2s infinite;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
            font-size: 12px;
            color: #aaa;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .platforms {
            margin-bottom: 24px;
        }

        .platforms-title {
            font-size: 12px;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-align: center;
        }

        .platform-list {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .platform-badge {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #ccc;
            transition: all 0.2s ease;
        }

        .platform-badge.active {
            background: #f5c518;
            border-color: #f5c518;
            color: #000;
        }

        .footer {
            text-align: center;
            border-top: 1px solid #333;
            padding-top: 16px;
            margin-top: 8px;
        }

        .creator-link {
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .creator-link:hover {
            color: #f5c518;
        }

        .version {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 10px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="version">v3.0</div>
    
    <div class="container">
        <div class="header">
            <div class="logo">IMDBuddy</div>
            <div class="tagline">Smart IMDb ratings for streaming</div>
            <div class="description">
                Never wonder "Is this worth watching?" again. See trusted IMDb ratings instantly on any streaming platform.
            </div>
        </div>

        <div class="status-banner" id="site-status">
            <span class="status-dot"></span>
            Checking current site&hellip;
        </div>

        <div class="features">
            <div class="feature">✨ Smart Matching</div>
            <div class="feature">⚡ Instant Results</div>
        </div>

        <div class="platforms">
            <div class="platforms-title">Supported Platforms</div>
            <div class="platform-list">
                <span class="platform-badge" data-platform="hotstar">Hotstar</span>
                <span class="platform-badge" data-platform="disneyplus">Disney+</span>
                <span class="platform-badge" data-platform="netflix">Netflix</span>
                <span class="platform-badge" data-platform="prime">Prime Video</span>
            </div>
        </div>

        <div class="footer">
            <a href="https://x.com/intent/user?screen_name=the2ndfloorguy" class="creator-link" target="_blank">@the2ndfloorguy</a>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
